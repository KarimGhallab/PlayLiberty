packages:
  - apps/*
  - packages/*
  - e2e/*
verifyDepsBeforeRun: false
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: true
  msw: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@types/node@26.6.2'
  - eslint@10.11.0
  - '@tanstack/react-router@1.170.41 || 1.170.46'
  - '@tanstack/router-core@1.171.34 || 1.171.39'
  - '@fastify/static@10.1.7'
  - sass@1.106.1
  - zustand@5.0.16
  - seroval-plugins@1.8.0
  - seroval@1.8.0
overrides:
  esbuild@<=0.24.2: ^0.25.0
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.1
  # fastify > ajv and fast-json-stringify; drop when both depend on these floors.
  fast-uri@>=3 <4: ^3.1.9
  fast-uri@>=4 <5: ^4.2.3
  # @tanstack/router-core accepts ^1.6.7; drop when it requires >=1.6.11.
  seroval: 1.8.0
  seroval-plugins: 1.8.0
