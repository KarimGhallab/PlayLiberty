packages:
  - apps/*
  - packages/*
  - e2e
verifyDepsBeforeRun: false
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: true
  msw: false
  unrs-resolver: set this to true or false
minimumReleaseAgeExclude:
  - '@types/node@26.6.2'
  - eslint@10.11.0
  - '@tanstack/react-router@1.170.41 || 1.170.46'
  - '@tanstack/router-core@1.171.34 || 1.171.39'
  - '@fastify/static@10.1.7'
  - sass@1.106.1
  - zustand@5.0.16
overrides:
  esbuild@<=0.24.2: ^0.25.0
  react: 19.3.1
  react-dom: 19.3.1
  react-native: 0.86.3
