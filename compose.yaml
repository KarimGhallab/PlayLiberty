services:
  server:
    build:
      context: .
      dockerfile: apps/server/Containerfile
    image: localhost/playliberty-server:dev
    environment:
      LOG_LEVEL: debug
      ADMIN_PANGOLIN_USER_IDS: ${ADMIN_PANGOLIN_USER_IDS:-}
    # Development only: a published loopback port. Production publishes none.
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - playliberty-media:/media
      - playliberty-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    cpus: 1.0

  web:
    build:
      context: .
      dockerfile: apps/web/Containerfile
    image: localhost/playliberty-web:dev
    depends_on:
      - server
    # Development only: a published loopback port. Production publishes none.
    ports:
      - '127.0.0.1:3000:8080'
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /var/cache/nginx:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 128
    cpus: 0.5

volumes:
  playliberty-media:
  playliberty-data:
