appId: dev.playliberty.app
name: A track is removed and restored with Undo
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: account-door
    timeout: 30000
    optional: true
# The dev proxy provisions without a credential.
- runFlow:
    when:
      visible:
        id: sign-in
    commands:
      - tapOn:
          id: sign-in
      - extendedWaitUntil:
          visible:
            id: account-door
          timeout: 60000
- assertVisible:
    id: account-door
- extendedWaitUntil:
    visible:
      id: playlist-card
    timeout: 30000
# The name keeps the flow independent of gallery order and of a shared first card.
- scrollUntilVisible:
    element:
      text: ${OWNED_PLAYLIST}
    direction: DOWN
    timeout: 30000
- tapOn:
    text: ${OWNED_PLAYLIST}
- extendedWaitUntil:
    visible:
      id: playlist-screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: track-row
    timeout: 30000
# The row removed is the row asserted after Undo.
- copyTextFrom:
    id: track-title
    index: 0
- tapOn:
    id: track-actions
    index: 0
- extendedWaitUntil:
    visible:
      id: track-actions-sheet
    timeout: 15000
# Undo lives for six seconds; a settle wait can let the removal commit first.
- tapOn:
    id: track-action-remove
    waitToSettleTimeoutMs: 0
# The action is the snackbar, and pressing it must land inside the window.
- tapOn:
    id: undo-snackbar-action
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    notVisible:
      id: undo-snackbar
    timeout: 15000
- assertVisible: ${maestro.copiedText}
# Leave the device in the library.
- back
- extendedWaitUntil:
    visible:
      id: account-door
    timeout: 15000
