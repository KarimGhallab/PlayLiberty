plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.playliberty.backgroundplayback'
version = '1.0.0'

android {
  namespace "dev.playliberty.backgroundplayback"

  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'androidx.media:media:1.7.0'
}
