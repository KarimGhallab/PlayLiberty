# The origin's security headers, in one place because nginx drops inherited
# `add_header` directives at any level that defines one. The server block includes
# it, and so does every location that adds its own header, or the shell and the
# assets would ship without the CSP.
#
# The CSP is strict because the app loads only same-origin resources: the bundled
# scripts and styles, the API's thumbnails and audio, and the live stream. There
# are no third-party scripts, no inline script tags, and no data or blob URLs.
# React's dynamic styles are set through the CSSOM, which CSP does not police, so
# no `unsafe-inline` is needed for them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# The legacy counterpart of `frame-ancestors`, for a browser that does not read
# the CSP yet.
add_header X-Frame-Options "DENY" always;
