# The origin's security headers. Every location that adds a header must include
# this again, because nginx drops inherited `add_header` directives.

# Strict because the app loads only same-origin resources; React's dynamic
# styles go through the CSSOM, which CSP does not police (no `unsafe-inline`).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Legacy counterpart of `frame-ancestors` for browsers that ignore the CSP.
add_header X-Frame-Options "DENY" always;
