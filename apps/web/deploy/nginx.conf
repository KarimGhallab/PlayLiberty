# The single public origin. It serves the built SPA and proxies the API to the
# server, so the browser sees one origin and no CORS is needed. In the dev stack
# `server` is the Compose service name; a production pod maps `server` to
# 127.0.0.1 with a hostAlias, because its containers share one network namespace.
# Production publishes no host port; the edge attaches to this container.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forwarded unchanged to the server. The Pangolin Remote-* headers and the
    # client's X-PlayLiberty-Client header pass through by default.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        proxy_pass http://server:8080;
    }

    # The live event stream never ends, so its response is not buffered and its
    # read timeout outlasts the heartbeat. Every other API response keeps nginx's
    # defaults, which is why this is its own location rather than a setting on
    # `/api/`.
    location = /api/v1/events {
        proxy_pass http://server:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_http_version 1.1;
    }

    location /api/ {
        proxy_pass http://server:8080;
    }

    # Vite hashes asset filenames, so they are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell is never cached, so a deploy is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client routes fall back to the shell. /api and /healthz never reach here,
    # because each has its own location above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
