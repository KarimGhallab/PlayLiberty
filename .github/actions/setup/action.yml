name: Setup
description: Install the pinned toolchain and the workspace dependencies.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 12.4.2

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: '26.5.0'
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
