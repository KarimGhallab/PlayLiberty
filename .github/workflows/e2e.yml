name: E2E tests

on:
  workflow_call:

jobs:
  e2e:
    name: E2E (${{ matrix.browser }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            browser: firefox
          - os: windows-2025
            browser: chromium
          - os: macos-15
            browser: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build the workspace
        run: pnpm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('e2e/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.browser }}-

      - name: Install ${{ matrix.browser }}
        run: pnpm --filter @playliberty/e2e exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run the e2e tests
        run: pnpm run test:e2e
        env:
          E2E_BROWSER: ${{ matrix.browser }}
