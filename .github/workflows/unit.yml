name: Unit tests

on:
  workflow_call:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build the workspace
        run: pnpm run build

      - name: Run the unit tests
        run: pnpm run test:unit
