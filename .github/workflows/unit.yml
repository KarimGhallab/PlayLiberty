name: Unit tests

on:
  workflow_call:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The workspace packages are read from `dist`, not from source, and the
      # token stylesheet is read from `packages/tokens/dist`.
      - name: Build the workspace
        run: pnpm run build

      - name: Run the unit tests
        run: pnpm run test:unit
