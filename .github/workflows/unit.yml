name: Unit

on:
  workflow_call:

jobs:
  unit:
    name: Unit tests (all workspaces)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build the workspace
        run: pnpm run build

      - name: Run every unit test
        run: pnpm run test:unit
