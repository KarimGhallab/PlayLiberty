name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  verify:
    uses: ./.github/workflows/verify.yml

  unit:
    uses: ./.github/workflows/unit.yml
    needs:
      - verify
      - build

  e2e:
    uses: ./.github/workflows/e2e.yml
    needs:
      - unit

  success:
    name: Pipeline successful
    needs: [build, verify, unit, e2e]
    runs-on: ubuntu-26.04
    steps:
      - run: echo "CI pipeline successful."
