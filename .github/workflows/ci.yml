name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    uses: ./.github/workflows/build.yml
    needs:
      - verify

  unit:
    uses: ./.github/workflows/unit.yml
    needs:
      - build

  e2e-web:
    uses: ./.github/workflows/e2e-web.yml
    needs:
      - unit

  e2e-mobile:
    uses: ./.github/workflows/e2e-mobile.yml
    needs:
      - unit

  success:
    name: Pipeline successful
    needs: [verify, build, unit, e2e-web, e2e-mobile]
    runs-on: ubuntu-26.04
    steps:
      - run: echo "CI pipeline successful."
