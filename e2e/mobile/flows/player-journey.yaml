appId: dev.playliberty.app
name: The player crosses a queue and a navigation
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: account-door
    timeout: 30000
    optional: true
# The dev proxy provisions without a credential.
- runFlow:
    when:
      visible:
        id: sign-in
    commands:
      - tapOn:
          id: sign-in
      - extendedWaitUntil:
          visible:
            id: account-door
          timeout: 60000
- assertVisible:
    id: account-door
- extendedWaitUntil:
    visible:
      id: playlist-card
    timeout: 30000
# The name keeps the flow independent of gallery order and of a shared first card.
- scrollUntilVisible:
    element:
      text: ${OWNED_PLAYLIST}
    direction: DOWN
    timeout: 30000
- tapOn:
    text: ${OWNED_PLAYLIST}
- extendedWaitUntil:
    visible:
      id: playlist-screen
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: track-play
    timeout: 30000
# Start the queue at the first playable row. The equalizer animates while audio
# plays, so the tap does not wait for the screen to settle.
- tapOn:
    id: track-play
    index: 0
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: player-bar
    timeout: 15000
# Advance once in the bar.
- tapOn:
    id: player-next
    waitToSettleTimeoutMs: 0
# A named row is the jump: a failed row has no play control, so an index would
# name a different row; the row may be last, so it only clears the floating action.
- scrollUntilVisible:
    element:
      id: track-play
      text: .*${TRACK_TITLE}.*
      above:
        id: detail-fab
    direction: DOWN
    timeout: 30000
- tapOn:
    id: track-play
    text: .*${TRACK_TITLE}.*
    point: '50%,5%'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: player-title
      text: ${TRACK_TITLE}
    timeout: 15000
# Leave the detail; the bar stays over the gallery.
- back
- extendedWaitUntil:
    visible:
      id: account-door
    timeout: 15000
- assertVisible:
    id: player-bar
