appId: dev.playliberty.app
name: Provisioning returns to the library
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: account-door
    timeout: 30000
    optional: true
# Start signed out, whichever state the app opened in.
- runFlow:
    when:
      visible:
        id: account-door
    commands:
      - tapOn:
          id: account-door
          point: '10%,50%'
      - tapOn:
          id: account-sign-out
      # The first press arms the question; the second ends the session.
      - tapOn:
          id: account-sign-out-confirm
- assertVisible:
    id: sign-in
- tapOn:
    id: sign-in
- extendedWaitUntil:
    visible:
      id: account-door
    timeout: 60000
- assertVisible:
    id: account-door
- assertNotVisible:
    id: sign-in
# The token survives a kill and relaunch.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: account-door
    timeout: 60000
- assertVisible:
    id: account-door
- assertNotVisible:
    id: sign-in
